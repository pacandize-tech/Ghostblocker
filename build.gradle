plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

loom {
	mods {
		"ghostblocker" {
			sourceSet sourceSets.main
		}
	}
}

// `gradlew runClientGameTest` opens a test world and checks the features in a real client.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "ghostblocker-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// GPL-3.0 (this mod, Secret Routes data, Dungeon Rooms Mod data) and BSD-3 (Odin room detection) notices ship in the jar.
jar {
	from("LICENSE")
	from("LICENSE-ODIN.txt")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}